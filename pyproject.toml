[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["node_modules", "dist", "fake_website"]

[tool.ruff.lint]
# pyflakes, pycodestyle, import sorting, bugbear, pyupgrade, simplify
select = ["F", "E", "W", "I", "B", "UP", "SIM"]
# FastAPI's Depends() in argument defaults is the intended pattern
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Prompt text reads better unwrapped
"helpers/prompt.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["agent", "helpers", "models", "routes", "services", "fastapi_config", "main"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:starlette.*", "ignore:Using `httpx`"]
